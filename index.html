<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8833a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compagni di Merende">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Compagni di Merende</title>
<style>
  :root {
    --ink: #2b2b2b; --muted: #6b625a; --bg: #fffaf5; --card: #fff; --line: #f0e6dc;
    --accent: #e8833a; --accent-soft: #fff3e6;
    --ok: #2e8b3e; --half: #c99a00; --no: #cf3b26;
    --school: #3b78bf; --home: #d9661f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--accent); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
  header div { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: 10px;
    font-size: 20px; width: 40px; height: 40px; }
  .days { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; background: var(--accent-soft);
    border-bottom: 1px solid var(--line); }
  .days button { flex: 1 0 auto; min-width: 56px; border: 1px solid var(--line); background: #fff;
    border-radius: 10px; padding: 6px 4px; font: inherit; font-size: 13px; color: var(--ink); position: relative; }
  .days button b { display: block; font-size: 16px; }
  .days button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .days button.today::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px;
    margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
  .days button.closed { color: #aaa; }
  main { padding: 12px 12px 100px; max-width: 560px; margin: 0 auto; }
  h2 { font-size: 20px; margin: 6px 4px 10px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 4px 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .dish { flex: 1; min-width: 0; }
  .dish small { display: block; color: var(--muted); font-size: 12px; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 38px; height: 38px; border-radius: 50%; border: 2px solid; background: #fff;
    font: 700 17px/1 inherit; display: grid; place-items: center; padding: 0; }
  .dot.ok { border-color: var(--ok); color: var(--ok); }
  .dot.half { border-color: var(--half); color: var(--half); }
  .dot.no { border-color: var(--no); color: var(--no); }
  .dot.ok.on { background: var(--ok); color: #fff; }
  .dot.half.on { background: var(--half); color: #fff; }
  .dot.no.on { background: var(--no); color: #fff; }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 4px 10px; }
  .big { font-size: 22px; font-weight: 600; margin: 2px 0 6px; }
  .plate { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .chip { border-radius: 999px; padding: 4px 10px; font-size: 14px; background: var(--accent-soft); border: 1px solid #f5d2b3; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .choices button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px;
    font: inherit; font-size: 14px; color: var(--ink); }
  .choices button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .choices.kids { margin: 0 0 10px; }
  .row .link { white-space: nowrap; }
  .why { background: #f7f3ee; border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-top: 8px; }
  .why b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
  .recipe-link { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
    background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; font: inherit; color: var(--ink); }
  .recipe-link:first-child { border-top: 0; }
  .recipe-link span { color: var(--muted); font-size: 13px; white-space: nowrap; margin-left: 8px; }
  .draft { border-left: 4px solid var(--half); background: #fbf0cc; color: #5a4500; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 12px 0; }
  .info { border-left: 4px solid var(--school); background: #e9f1fb; color: #1d3c61; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }
  .legend { display: flex; gap: 14px; font-size: 13px; margin: 0 4px 8px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .bar-row { padding: 7px 0; border-top: 1px solid var(--line); }
  .bar-row:first-child { border-top: 0; }
  .bar-head { display: flex; justify-content: space-between; font-size: 15px; }
  .bar-head span { font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar-head span b { color: var(--ink); }
  .bar { position: relative; height: 14px; background: #f3f0ec; border-radius: 7px; margin-top: 4px; overflow: hidden; display: flex; }
  .bar .s { background: var(--school); }
  .bar .h { background: var(--home); }
  .bar .goal { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
  .bar-note { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .switch { display: flex; gap: 6px; margin-top: 6px; }
  .switch button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px; font: inherit; font-size: 13px; }
  .switch button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .meal { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .meal:first-child { border-top: 0; }
  .meal .when { width: 104px; flex: none; color: var(--muted); font-size: 14px; }
  .meal .what { flex: 1; }
  .meal .what small { display: block; color: var(--muted); font-size: 13px; }
  ul.list { margin: 4px 0 0; padding-left: 20px; }
  ul.list li { margin: 3px 0; }
  ol.steps { padding-left: 20px; margin: 4px 0 0; }
  ol.steps li { margin: 6px 0; }
  label.field { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; font: inherit; padding: 10px; border: 1px solid #ddd0c2; border-radius: 10px; background: #fff; color: var(--ink); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; margin-top: 14px; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; background: #fff;
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 9px 0 11px; font: inherit; font-size: 12px; color: var(--muted); }
  nav button span { display: block; font-size: 22px; line-height: 1.1; }
  nav button.on { color: var(--accent); font-weight: 600; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 13px; padding: 4px; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 5;
    max-width: 536px; margin: 0 auto; background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 14px;
    font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .3s, transform .3s; }
  .toast.hide { opacity: 0; transform: translateY(12px); pointer-events: none; }
  .toast button { background: none; border: 0; color: #ffcf9e; font: inherit; font-weight: 600; padding: 0; margin-left: 6px; }
  .back { background: none; border: 0; font: inherit; color: var(--accent); padding: 4px 4px 8px; font-weight: 600; }
</style>
</head>
<body>
<header id="header"></header>
<div class="days" id="days" hidden></div>
<main id="main"><p class="hint">Carico il menù…</p></main>
<nav id="nav" hidden></nav>
<div class="toast hide" id="toast"></div>

<script src="recipes.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- rules (draft unless noted)
// Weekly targets, 4-6 years: CREA, Linee guida per una sana alimentazione 2018, Tab. 9.2 (official source).
// Fruit is "2-3 al giorno": the bar uses the minimum (14).
const GROUPS = {
  pesce:    { label: "Pesce",     target: 3 },
  carne:    { label: "Carne",     target: 3 },
  uova:     { label: "Uova",      target: 2 },
  formaggi: { label: "Formaggio", target: 3 },
  legumi:   { label: "Legumi",    target: 3 },
  verdura:  { label: "Verdura",   target: 14, note: "2 al giorno" },
  frutta:   { label: "Frutta",    target: 14, note: "2–3 al giorno: qui il minimo" },
};
const SECONDS = ["pesce", "legumi", "uova", "formaggi", "carne"]; // tie-break order (draft)
const SLOT_LABEL = { spuntino: "Spuntino", primo: "Primo", secondo: "Secondo", contorno: "Contorno",
  frutta_dolce: "Frutta o dolce", merenda: "Merenda" };
const MARKABLE = ["spuntino", "primo", "secondo", "contorno", "frutta_dolce", "merenda"];
const WEIGHT = { ok: 1, half: 0.5, no: 0 };
const WORD = { pesce: "pesce", carne: "carne", uova: "uova", formaggi: "formaggio", legumi: "legumi",
  verdura: "verdura", frutta: "frutta", cereali: "pasta, riso o pane", patate: "patate", dolci: "dolce", latte: "latte o yogurt" };
const OTHER_LABEL = { cereali: "Cereali", patate: "Patate", dolci: "Dolce", latte: "Latte e yogurt" };
const ART = { pesce: "il pesce", carne: "la carne", uova: "le uova", formaggi: "il formaggio", legumi: "i legumi" };
const WEEKDAYS = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];

// ---------------------------------------------------------------- statistics (GoatCounter, no cookies)
// Only screen names, the Municipio and the number of children are counted, never names or what was eaten.
const GOATCOUNTER = "menuinfanzia";   // -> https://menuinfanzia.goatcounter.com
function track(path, title) {
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title: title || path, event: true }); } catch {}
}
function trackProfile() {
  if (!INDEX) return;
  track("figli-" + state.kids.length, "Figli: " + state.kids.length);
  for (const k of state.kids) track("municipio-" + INDEX.municipi[k.mun], "Municipio " + INDEX.municipi[k.mun]);
}
if (GOATCOUNTER && !/^(localhost|127\.)/.test(location.hostname)) {
  window.goatcounter = { no_onload: true };
  const sc = document.createElement("script");
  sc.async = true; sc.src = "https://gc.zgo.at/count.js";
  sc.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  sc.onload = () => { track("apertura", "App aperta"); if (state.kids.length) trackProfile(); };
  document.head.appendChild(sc);
}

// ---------------------------------------------------------------- state
// kids: [{ name, mun, ciclo, checks: {date: {slot: ok|half|no}}, absent: {date: true} }]; dinners are shared by the family.
const KEY = "menuinfanzia.v2";
const state = Object.assign({ kids: [], kid: 0, tab: "oggi", sel: null, dinners: {}, unmarked: "ok", weekStart: null, recipe: null },
  migrate(safeLoad()), { tab: "oggi", sel: null, recipe: null, editing: null });
if (state.kid >= state.kids.length) state.kid = 0;
function safeLoad() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } }
function migrate(s) {             // version with one child: profile + checks + absent
  if (s.profile && !s.kids) s.kids = [Object.assign({}, s.profile, { checks: s.checks || {}, absent: s.absent || {} })];
  delete s.profile; delete s.checks; delete s.absent;
  return s;
}
const save = () => { try { const { editing, ...keep } = state; localStorage.setItem(KEY, JSON.stringify(keep)); } catch {} };
const K = () => state.kids[state.kid];
const many = () => state.kids.length > 1;
const kidName = k => state.kids[k].name || (many() ? `Figlio ${k + 1}` : "Il bambino");

let INDEX = null;          // data/index.json
const MENUS = {};          // "2026-11/m6-c4" -> menu json (or null if missing)
let WEEK = null;           // { start, dates: [5], kids: [ [5 x {date, items|null, note, source}] per child ] }

// ---------------------------------------------------------------- dates (local, no UTC shifts)
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
function todayIso() {
  const q = new URLSearchParams(location.search).get("oggi"); // ?oggi=2026-10-21 to simulate a day
  return q && /^\d{4}-\d\d-\d\d$/.test(q) ? q : iso(new Date());
}
function mondayOf(s) { const d = parse(s), wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); }
const short = s => `${Number(s.slice(8))}/${Number(s.slice(5, 7))}`;
const dayLabel = s => `${WEEKDAYS[parse(s).getDay()]} ${short(s)}`;

// ---------------------------------------------------------------- helpers
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => { const w = Math.floor(n + 1e-9), h = n - w > 0.01; return (w || !h ? String(w) : "") + (h ? "½" : ""); };
const zero = () => Object.fromEntries(Object.keys(GROUPS).map(g => [g, 0]));
const add = (a, b) => { for (const g in a) a[g] += b[g] || 0; return a; };
const mark = (k, date, slot) => (state.kids[k].checks[date] || {})[slot];
const andList = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " e " + a[a.length - 1];

// ---------------------------------------------------------------- data loading
async function getJson(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + ": " + r.status);
  return r.json();
}
async function loadMenu(kid, month) {
  const file = `m${kid.mun}-c${kid.ciclo}`, key = `${month}/${file}`;
  if (key in MENUS) return MENUS[key];
  const has = INDEX.months[month] && INDEX.months[month].includes(file);
  MENUS[key] = has ? await getJson(`data/${key}.json`).catch(() => null) : null;
  return MENUS[key];
}
async function loadWeek() {
  const start = state.weekStart || mondayOf(todayIso());
  const dates = [0, 1, 2, 3, 4].map(i => addDays(start, i));
  const months = [...new Set(dates.map(d => d.slice(0, 7)))];
  const kids = await Promise.all(state.kids.map(async kid => {
    const menus = await Promise.all(months.map(m => loadMenu(kid, m)));
    const byDate = {};
    menus.forEach(m => m && m.days.forEach(d => byDate[d.date] = Object.assign({ source: m.source, fetched: m.fetched }, d)));
    return dates.map(date => byDate[date] || { date, items: null });
  }));
  WEEK = { start, dates, kids };
  const t = todayIso(), i = dates.indexOf(t);
  if (state.sel === null || state.sel > 4) state.sel = i >= 0 ? i : 4;
  if (i < 0 && t > dates[4] && t <= addDays(start, 6) && state.tab === "oggi" && !state.weekStart) state.tab = "weekend";
}
function weeksAvailable() {
  const mondays = new Set();
  for (const m in INDEX.months) {
    if (!state.kids.some(k => INDEX.months[m].includes(`m${k.mun}-c${k.ciclo}`))) continue;
    const d = parse(m + "-01");
    while (iso(d).slice(0, 7) === m) { if (d.getDay() >= 1 && d.getDay() <= 5) mondays.add(mondayOf(iso(d))); d.setDate(d.getDate() + 1); }
  }
  return [...mondays].sort();
}
const day = (k, i) => WEEK.kids[k][i];
const anyMenu = () => WEEK.kids.some(ds => ds.some(d => d.items));
const dayClosed = i => WEEK.kids.every(ds => !ds[i].items);

// ---------------------------------------------------------------- the calculation
const atSchool = (k, i) => { const d = day(k, i); return d && d.items && !state.kids[k].absent[d.date]; };
function schoolDay(k, i) {         // eaten at school, as marked
  const out = zero();
  if (!atSchool(k, i)) return out;
  const d = day(k, i);
  for (const it of d.items) {
    if (!(it.group in out) || !MARKABLE.includes(it.slot)) continue;
    const m = mark(k, d.date, it.slot);
    out[it.group] += m ? WEIGHT[m] : WEIGHT[state.unmarked];
  }
  return out;
}
function plannedDay(k, i) {        // still to come at school, everything eaten
  const out = zero();
  if (!atSchool(k, i)) return out;
  for (const it of day(k, i).items) if (it.group in out && MARKABLE.includes(it.slot)) out[it.group] += 1;
  return out;
}
const lunchGroups = (k, i) => i > 4 || !atSchool(k, i) ? []
  : day(k, i).items.filter(it => it.slot === "primo" || it.slot === "secondo").map(it => it.group);
const behind = m => SECONDS.reduce((a, g) => a + Math.max(0, m[g]), 0);

// One dish for the whole family. The child most behind with the week comes first;
// if two or more are level, the dish that covers the most missing portions overall.
function choose(missings, excluded) {
  const scores = missings.map(behind), top = Math.max(...scores);
  const leaders = scores.map((s, k) => s === top ? k : -1).filter(k => k >= 0);
  const lead = missings.length > 1 && leaders.length === 1 && top > 0 ? leaders[0] : null;
  let pick = null, best = null;
  for (const g of SECONDS) {
    if (excluded.has(g)) continue;
    const sum = missings.reduce((a, m) => a + Math.max(0, m[g]), 0);
    if (sum <= 0) continue;
    const key = lead !== null ? [Math.max(0, missings[lead][g]), sum] : [sum, 0];
    if (!best || key[0] > best[0] || (key[0] === best[0] && key[1] > best[1])) { best = key; pick = g; }
  }
  return { pick, lead: pick ? lead : null };
}

// Dinners Monday..day `upto`. A dinner already recorded counts as recorded, otherwise as proposed.
function plan(upto) {
  const n = state.kids.length, home = state.kids.map(zero), dinners = [];
  let prev = null;
  for (let i = 0; i <= upto; i++) {
    const per = state.kids.map((_, k) => {
      const school = zero();
      for (let j = 0; j < 5; j++) add(school, j <= i ? schoolDay(k, j) : plannedDay(k, j));
      const missing = {};
      for (const g in GROUPS) missing[g] = GROUPS[g].target - school[g] - home[k][g];
      const d = day(k, i);
      const contorno = atSchool(k, i) && d.items.find(it => it.slot === "contorno");
      const vegSide = !!contorno && contorno.group === "verdura";
      return { k, missing, contorno, today: lunchGroups(k, i), tomorrow: lunchGroups(k, i + 1),
        vegLeft: vegSide && mark(k, d.date, "contorno") === "no",
        potatoes: !!contorno && !vegSide,             // potatoes do not count as vegetables
        noSchool: !atSchool(k, i) };
    });
    const missings = per.map(p => p.missing);
    const all = new Set(per.flatMap(p => [...p.today, ...p.tomorrow]));
    if (prev) all.add(prev);
    let r = choose(missings, all), relaxed = false;
    if (!r.pick && n > 1) {          // better a repeat for one child than nobody covered
      for (const k of [...per.keys()].sort((a, b) => behind(missings[b]) - behind(missings[a]))) {
        const ex = new Set([...per[k].today, ...per[k].tomorrow]);
        if (prev) ex.add(prev);
        r = choose(missings, ex);
        if (r.pick) { relaxed = true; break; }
      }
    }
    const pick = r.pick;
    const repeatKids = pick ? per.filter(p => p.today.includes(pick) || p.tomorrow.includes(pick)).map(p => p.k) : [];
    const veg = per.some(p => p.vegLeft || p.potatoes || p.noSchool) ? 2 : 1;
    const date = WEEK.dates[i], done = state.dinners[date];
    const eaten = done === undefined ? pick : (done === "altro" ? null : done);
    per.forEach((p, k) => {
      if (eaten && eaten in home[k]) home[k][eaten] += 1;
      home[k].verdura += veg; home[k].frutta += 1;
      if (p.noSchool) home[k].frutta += 1;  // lunch at home: one more fruit
    });
    dinners.push({ pick, lead: r.lead, relaxed, repeatKids, veg, per, prev, done, i });
    prev = eaten;
  }
  return { dinners, home };
}

function weekendPlan() {
  const { home, dinners } = plan(4);
  const missings = state.kids.map((_, k) => {
    const school = zero();
    for (let j = 0; j < 5; j++) add(school, schoolDay(k, j));
    const m = {};
    for (const g in GROUPS) m[g] = GROUPS[g].target - school[g] - home[k][g];
    return m;
  });
  const left = missings.map(m => Object.assign({}, m));
  const meals = [["Sabato", "pranzo"], ["Sabato", "cena"], ["Domenica", "pranzo"], ["Domenica", "cena"]];
  let prev = dinners[4].done === undefined ? dinners[4].pick : (dinners[4].done === "altro" ? null : dinners[4].done);
  const used = {};
  const out = meals.map(([d, meal]) => {
    const { pick, lead } = choose(left, new Set(prev ? [prev] : []));
    if (pick) left.forEach(m => m[pick] -= 1);
    prev = pick;
    const list = pick ? RECIPES.filter(r => r.group === pick) : [];
    const recipe = list.length ? list[(used[pick] = (used[pick] || 0) + 1) % list.length] : null;
    return { day: d, meal, pick, lead, recipe };
  });
  return { missings, meals: out };
}

function dinnerWhy(x) {
  const { pick, per, prev, i } = x;
  const words = arr => [...new Set(arr)].filter(g => g in ART).map(g => ART[g]).join(" e ") || "niente di questo";
  const tomorrowSchool = k => i < 4 && atSchool(k, i + 1);
  let why;
  if (!many()) {
    const p = per[0], missing = p.missing;
    if (pick) {
      why = `Questa settimana mancano ancora <strong>${fmt(missing[pick])} ${missing[pick] > 1 ? "porzioni" : "porzione"} di ${WORD[pick]}</strong>, contando anche i pranzi a scuola fino a venerdì. `;
      why += p.noSchool ? "Oggi niente pranzo a scuola" : `A pranzo oggi: ${words(p.today)}`;
      why += i < 4 ? (tomorrowSchool(0) ? `; domani: ${words(p.tomorrow)}.` : "; domani niente scuola.") : "; domani è sabato.";
    } else why = SECONDS.some(g => missing[g] > 0)
      ? "I secondi che mancano ci sono già a pranzo oggi o domani, o li avete mangiati ieri sera: stasera un piatto leggero con verdura, si recupera nei prossimi giorni."
      : "I secondi della settimana sono già coperti: stasera basta un piatto leggero con verdura.";
  } else {
    const gaps = per.map(p => {
      const g = SECONDS.filter(s => p.missing[s] > 0).sort((a, b) => p.missing[b] - p.missing[a]);
      return `${esc(kidName(p.k))} ${g.length ? g.map(s => `${fmt(p.missing[s])} ${WORD[s]}`).join(", ") : "niente"}`;
    });
    why = `Per chiudere la settimana mancano: ${gaps.join("; ")}. `;
    if (pick) {
      why += x.lead !== null
        ? `<br>Proponiamo <strong>${WORD[pick]}</strong> perché ${esc(kidName(x.lead))} è più indietro con la settimana. `
        : `<br>Siete pari: proponiamo <strong>${WORD[pick]}</strong>, il piatto che serve di più a tutti. `;
      why += "<br>A pranzo oggi: " + per.map(p => `${esc(kidName(p.k))} ${p.noSchool ? "a casa" : words(p.today)}`).join(", ");
      why += i < 4 ? "; domani: " + per.map(p => `${esc(kidName(p.k))} ${tomorrowSchool(p.k) ? words(p.tomorrow) : "niente scuola"}`).join(", ") + "." : "; domani è sabato.";
      if (x.relaxed && x.repeatKids.length) why += `<br>Non c'era un piatto che andasse bene per tutti: meglio che ${andList(x.repeatKids.map(k => esc(kidName(k))))} ${x.repeatKids.length > 1 ? "ripetano" : "ripeta"} ${ART[pick]} piuttosto che lasciare scoperto chi è più indietro.`;
    } else why += per.some(p => behind(p.missing) > 0)
      ? "I secondi che mancano ci sono già a pranzo oggi o domani, o li avete mangiati ieri sera: stasera un piatto leggero con verdura."
      : "Stasera basta un piatto leggero con verdura.";
  }
  if (pick && prev && ART[prev]) why += `${many() ? "<br>" : " "}Ieri sera: ${ART[prev]}.`;
  for (const p of per) {
    const who = many() ? "<br>" + esc(kidName(p.k)) + ": " : "";
    if (p.vegLeft) why += ` ${who}a pranzo la verdura (${esc(p.contorno.name.toLowerCase())}) è rimasta nel piatto, stasera ne serve il doppio.`;
    if (p.potatoes) why += ` ${who}a pranzo il contorno era ${esc(p.contorno.name.toLowerCase())}; le patate non contano come verdura, quindi stasera verdura doppia.`;
    if (p.noSchool) why += ` ${who}senza il pranzo a scuola, oggi la verdura va doppia.`;
  }
  return why;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b || (b.type === "submit" && b.form)) return;
  const ds = b.dataset, date = WEEK && WEEK.dates[state.sel];
  if (ds.day) state.sel = Number(ds.day);
  else if (ds.kid) state.kid = Number(ds.kid);
  else if (ds.tab) { state.tab = ds.tab; state.recipe = null; state.editing = null; scrollTo(0, 0); track("schermata-" + ds.tab, "Schermata " + ds.tab); }
  else if (ds.slot) {
    const before = pickFor(state.sel);
    const c = K().checks[date] = K().checks[date] || {};
    if (c[ds.slot] === ds.v) delete c[ds.slot]; else c[ds.slot] = ds.v;
    const after = pickFor(state.sel);
    const name = g => g ? GROUPS[g].label.toLowerCase() : "una cena leggera";
    if (before.pick !== after.pick) toast(`Stasera cambia: ora proponiamo <b>${name(after.pick)}</b> (prima: ${name(before.pick)}).<button data-tab="stasera">Vedi</button>`);
    else if (before.veg !== after.veg) toast(after.veg === 2 ? `La verdura a pranzo è rimasta nel piatto: stasera <b>verdura doppia</b>.<button data-tab="stasera">Vedi</button>` : "Stasera basta una porzione di verdura.");
  }
  else if (ds.absent) { if (ds.absent === "1") K().absent[date] = true; else delete K().absent[date]; }
  else if (ds.dinner) { if (state.dinners[date] === ds.dinner) delete state.dinners[date]; else state.dinners[date] = ds.dinner; }
  else if (ds.recipe) { state.recipe = ds.recipe; scrollTo(0, 0); track("ricetta-" + ds.recipe, "Ricetta " + ds.recipe); }
  else if ("closeRecipe" in ds) state.recipe = null;
  else if (ds.cook) { track("cucinata-" + ds.cook, "Cena scelta: " + ds.cook); state.dinners[date] = ds.cook; state.recipe = null; state.tab = "stasera"; toast("Segnato: stasera " + GROUPS[ds.cook].label.toLowerCase() + "."); }
  else if (ds.editKid) { state.editing = ds.editKid === "new" ? "new" : Number(ds.editKid); scrollTo(0, 0); }
  else if ("cancelEdit" in ds) state.editing = null;
  else if (ds.removeKid) {
    const k = Number(ds.removeKid);
    if (!confirm(`Togliere ${kidName(k)} e le sue spunte?`)) return;
    state.kids.splice(k, 1); state.kid = 0; state.editing = null; await loadWeek();
  }
  else if (ds.unmarked) state.unmarked = ds.unmarked;
  else if (ds.weekSet) { state.weekStart = ds.weekSet; state.sel = 0; await loadWeek(); }
  else if ("weekToday" in ds) { state.weekStart = null; state.sel = null; await loadWeek(); }
  else if ("reset" in ds) { if (!confirm("Cancellare tutte le spunte e le cene segnate?")) return; state.kids.forEach(k => { k.checks = {}; k.absent = {}; }); state.dinners = {}; }
  else return;
  save(); render();
});
document.addEventListener("change", async e => {
  if (e.target.matches("[data-week]")) {
    const w = e.target.value;
    state.weekStart = w === mondayOf(todayIso()) ? null : w; state.sel = state.weekStart ? 0 : null;
    await loadWeek(); save(); render();
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "profile") return;
  e.preventDefault();
  const f = new FormData(e.target);
  const data = { name: String(f.get("name") || "").trim(), mun: Number(f.get("mun")), ciclo: Number(f.get("ciclo")) };
  const first = !state.kids.length, isNew = first || state.editing === "new";
  if (isNew) { state.kids.push(Object.assign(data, { checks: {}, absent: {} })); state.kid = state.kids.length - 1; }
  else Object.assign(state.kids[state.editing], data);
  state.editing = null;
  if (first) { state.tab = "oggi"; state.sel = null; }
  await loadWeek(); save(); render();
  if (first) track("nuovo-utente", "Nuovo utente");
  else toast(isNew ? `Aggiunto: ${esc(kidName(state.kid))}.` : "Impostazioni salvate.");
  trackProfile();
});

// ---------------------------------------------------------------- start
(async function start() {
  try {
    INDEX = await getJson("data/index.json");
    if (state.kids.length) await loadWeek();
    render();
  } catch (err) {
    document.getElementById("main").innerHTML = `<div class="info">Non riesco a caricare il menù. Controlla la connessione e riprova.<br><small>${esc(err.message)}</small></div>`;
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
