<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8833a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cena di casa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cena di casa</title>
<style>
  :root {
    --ink: #2b2b2b; --muted: #6b625a; --bg: #fffaf5; --card: #fff; --line: #f0e6dc;
    --accent: #e8833a; --accent-soft: #fff3e6;
    --ok: #2e8b3e; --half: #c99a00; --no: #cf3b26;
    --school: #3b78bf; --home: #d9661f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--accent); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
  header div { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: 10px;
    font-size: 20px; width: 40px; height: 40px; }
  .days { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; background: var(--accent-soft);
    border-bottom: 1px solid var(--line); }
  .days button { flex: 1 0 auto; min-width: 56px; border: 1px solid var(--line); background: #fff;
    border-radius: 10px; padding: 6px 4px; font: inherit; font-size: 13px; color: var(--ink); position: relative; }
  .days button b { display: block; font-size: 16px; }
  .days button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .days button.today::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px;
    margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
  .days button.closed { color: #aaa; }
  main { padding: 12px 12px 100px; max-width: 560px; margin: 0 auto; }
  h2 { font-size: 20px; margin: 6px 4px 10px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 4px 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .dish { flex: 1; min-width: 0; }
  .dish small { display: block; color: var(--muted); font-size: 12px; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 38px; height: 38px; border-radius: 50%; border: 2px solid; background: #fff;
    font: 700 17px/1 inherit; display: grid; place-items: center; padding: 0; }
  .dot.ok { border-color: var(--ok); color: var(--ok); }
  .dot.half { border-color: var(--half); color: var(--half); }
  .dot.no { border-color: var(--no); color: var(--no); }
  .dot.ok.on { background: var(--ok); color: #fff; }
  .dot.half.on { background: var(--half); color: #fff; }
  .dot.no.on { background: var(--no); color: #fff; }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 4px 10px; }
  .big { font-size: 22px; font-weight: 600; margin: 2px 0 6px; }
  .plate { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .chip { border-radius: 999px; padding: 4px 10px; font-size: 14px; background: var(--accent-soft); border: 1px solid #f5d2b3; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .choices button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px;
    font: inherit; font-size: 14px; color: var(--ink); }
  .choices button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .why { background: #f7f3ee; border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-top: 8px; }
  .why b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
  .recipe-link { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
    background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; font: inherit; color: var(--ink); }
  .recipe-link:first-child { border-top: 0; }
  .recipe-link span { color: var(--muted); font-size: 13px; white-space: nowrap; margin-left: 8px; }
  .draft { border-left: 4px solid var(--half); background: #fbf0cc; color: #5a4500; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 12px 0; }
  .info { border-left: 4px solid var(--school); background: #e9f1fb; color: #1d3c61; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }
  .legend { display: flex; gap: 14px; font-size: 13px; margin: 0 4px 8px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .bar-row { padding: 7px 0; border-top: 1px solid var(--line); }
  .bar-row:first-child { border-top: 0; }
  .bar-head { display: flex; justify-content: space-between; font-size: 15px; }
  .bar-head span { font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar-head span b { color: var(--ink); }
  .bar { position: relative; height: 14px; background: #f3f0ec; border-radius: 7px; margin-top: 4px; overflow: hidden; display: flex; }
  .bar .s { background: var(--school); }
  .bar .h { background: var(--home); }
  .bar .goal { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
  .bar-note { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .switch { display: flex; gap: 6px; margin-top: 6px; }
  .switch button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px; font: inherit; font-size: 13px; }
  .switch button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .meal { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .meal:first-child { border-top: 0; }
  .meal .when { width: 104px; flex: none; color: var(--muted); font-size: 14px; }
  .meal .what { flex: 1; }
  .meal .what small { display: block; color: var(--muted); font-size: 13px; }
  ul.list { margin: 4px 0 0; padding-left: 20px; }
  ul.list li { margin: 3px 0; }
  ol.steps { padding-left: 20px; margin: 4px 0 0; }
  ol.steps li { margin: 6px 0; }
  label.field { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; font: inherit; padding: 10px; border: 1px solid #ddd0c2; border-radius: 10px; background: #fff; color: var(--ink); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; margin-top: 14px; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; background: #fff;
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 9px 0 11px; font: inherit; font-size: 12px; color: var(--muted); }
  nav button span { display: block; font-size: 22px; line-height: 1.1; }
  nav button.on { color: var(--accent); font-weight: 600; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 13px; padding: 4px; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 5;
    max-width: 536px; margin: 0 auto; background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 14px;
    font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .3s, transform .3s; }
  .toast.hide { opacity: 0; transform: translateY(12px); pointer-events: none; }
  .toast button { background: none; border: 0; color: #ffcf9e; font: inherit; font-weight: 600; padding: 0; margin-left: 6px; }
  .back { background: none; border: 0; font: inherit; color: var(--accent); padding: 4px 4px 8px; font-weight: 600; }
</style>
</head>
<body>
<header id="header"></header>
<div class="days" id="days" hidden></div>
<main id="main"><p class="hint">Carico il menù…</p></main>
<nav id="nav" hidden></nav>
<div class="toast hide" id="toast"></div>

<script src="recipes.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- rules (draft unless noted)
// Weekly targets, 4-6 years: CREA, Linee guida per una sana alimentazione 2018, Tab. 9.2 (official source).
// Fruit is "2-3 al giorno": the bar uses the minimum (14).
const GROUPS = {
  pesce:    { label: "Pesce",     target: 3 },
  carne:    { label: "Carne",     target: 3 },
  uova:     { label: "Uova",      target: 2 },
  formaggi: { label: "Formaggio", target: 3 },
  legumi:   { label: "Legumi",    target: 3 },
  verdura:  { label: "Verdura",   target: 14, note: "2 al giorno" },
  frutta:   { label: "Frutta",    target: 14, note: "2–3 al giorno: qui il minimo" },
};
const SECONDS = ["pesce", "legumi", "uova", "formaggi", "carne"]; // tie-break order (draft)
const SLOT_LABEL = { spuntino: "Spuntino", primo: "Primo", secondo: "Secondo", contorno: "Contorno",
  frutta_dolce: "Frutta o dolce", merenda: "Merenda" };
const MARKABLE = ["spuntino", "primo", "secondo", "contorno", "frutta_dolce", "merenda"];
const WEIGHT = { ok: 1, half: 0.5, no: 0 };
const WORD = { pesce: "pesce", carne: "carne", uova: "uova", formaggi: "formaggio", legumi: "legumi",
  verdura: "verdura", frutta: "frutta", cereali: "pasta, riso o pane", patate: "patate", dolci: "dolce", latte: "latte o yogurt" };
const OTHER_LABEL = { cereali: "Cereali", patate: "Patate", dolci: "Dolce", latte: "Latte e yogurt" };
const ART = { pesce: "il pesce", carne: "la carne", uova: "le uova", formaggi: "il formaggio", legumi: "i legumi" };
const WEEKDAYS = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];

// ---------------------------------------------------------------- state
const KEY = "menuinfanzia.v2";
const state = Object.assign({ profile: null, tab: "oggi", sel: null, checks: {}, absent: {}, dinners: {},
  unmarked: "ok", weekStart: null, recipe: null }, safeLoad(), { tab: "oggi", sel: null, recipe: null });
function safeLoad() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

let INDEX = null;          // data/index.json
const MENUS = {};          // "2026-11/m6-c4" -> menu json (or null if missing)
let WEEK = null;           // { start, days: [5 x {date, weekday, items|null, note, source}] }

// ---------------------------------------------------------------- dates (local, no UTC shifts)
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
function todayIso() {
  const q = new URLSearchParams(location.search).get("oggi"); // ?oggi=2026-10-21 to simulate a day
  return q && /^\d{4}-\d\d-\d\d$/.test(q) ? q : iso(new Date());
}
function mondayOf(s) { const d = parse(s), wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); }
const short = s => `${Number(s.slice(8))}/${Number(s.slice(5, 7))}`;
const dayLabel = s => `${WEEKDAYS[parse(s).getDay()]} ${short(s)}`;

// ---------------------------------------------------------------- helpers
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => { const w = Math.floor(n + 1e-9), h = n - w > 0.01; return (w || !h ? String(w) : "") + (h ? "½" : ""); };
const zero = () => Object.fromEntries(Object.keys(GROUPS).map(g => [g, 0]));
const add = (a, b) => { for (const g in a) a[g] += b[g] || 0; return a; };
const mark = (date, slot) => (state.checks[date] || {})[slot];

// ---------------------------------------------------------------- data loading
async function getJson(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + ": " + r.status);
  return r.json();
}
async function loadMenu(month) {
  const key = `${month}/m${state.profile.mun}-c${state.profile.ciclo}`;
  if (key in MENUS) return MENUS[key];
  const has = INDEX.months[month] && INDEX.months[month].includes(`m${state.profile.mun}-c${state.profile.ciclo}`);
  MENUS[key] = has ? await getJson(`data/${key}.json`).catch(() => null) : null;
  return MENUS[key];
}
async function loadWeek() {
  const start = state.weekStart || mondayOf(todayIso());
  const dates = [0, 1, 2, 3, 4].map(i => addDays(start, i));
  const months = [...new Set(dates.map(d => d.slice(0, 7)))];
  const menus = await Promise.all(months.map(loadMenu));
  const byDate = {};
  menus.forEach(m => m && m.days.forEach(d => byDate[d.date] = Object.assign({ source: m.source, fetched: m.fetched }, d)));
  WEEK = { start, days: dates.map(date => byDate[date] || { date, items: null }) };
  const t = todayIso(), i = dates.indexOf(t);
  if (state.sel === null || state.sel > 4) state.sel = i >= 0 ? i : 4;
  if (i < 0 && t > dates[4] && t <= addDays(start, 6) && state.tab === "oggi" && !state.weekStart) state.tab = "weekend";
}
function weeksAvailable() {
  const mondays = new Set();
  for (const m in INDEX.months) {
    if (!INDEX.months[m].includes(`m${state.profile.mun}-c${state.profile.ciclo}`)) continue;
    const d = parse(m + "-01");
    while (iso(d).slice(0, 7) === m) { if (d.getDay() >= 1 && d.getDay() <= 5) mondays.add(mondayOf(iso(d))); d.setDate(d.getDate() + 1); }
  }
  return [...mondays].sort();
}

// ---------------------------------------------------------------- the calculation
const atSchool = i => { const d = WEEK.days[i]; return d && d.items && !state.absent[d.date]; };
function schoolDay(i) {            // eaten at school, as marked
  const out = zero();
  if (!atSchool(i)) return out;
  const d = WEEK.days[i];
  for (const it of d.items) {
    if (!(it.group in out) || !MARKABLE.includes(it.slot)) continue;
    const m = mark(d.date, it.slot);
    out[it.group] += m ? WEIGHT[m] : WEIGHT[state.unmarked];
  }
  return out;
}
function plannedDay(i) {           // still to come at school, everything eaten
  const out = zero();
  if (!atSchool(i)) return out;
  for (const it of WEEK.days[i].items) if (it.group in out && MARKABLE.includes(it.slot)) out[it.group] += 1;
  return out;
}
const lunchGroups = i => atSchool(i)
  ? WEEK.days[i].items.filter(it => it.slot === "primo" || it.slot === "secondo").map(it => it.group) : [];

function choose(missing, excluded) {
  let pick = null;
  for (const g of SECONDS) {
    if (excluded.has(g) || missing[g] <= 0) continue;
    if (!pick || missing[g] > missing[pick]) pick = g;
  }
  return pick;
}

// Dinners Monday..day `upto`. A dinner already recorded counts as recorded, otherwise as proposed.
function plan(upto) {
  const home = zero(), dinners = [];
  let prev = null;
  for (let i = 0; i <= upto; i++) {
    const school = zero();
    for (let j = 0; j < 5; j++) add(school, j <= i ? schoolDay(j) : plannedDay(j));
    const missing = {};
    for (const g in GROUPS) missing[g] = GROUPS[g].target - school[g] - home[g];
    const today = lunchGroups(i), tomorrow = i < 4 ? lunchGroups(i + 1) : [];
    const excluded = new Set([...today, ...tomorrow]);
    if (prev) excluded.add(prev);
    const pick = choose(missing, excluded);
    const d = WEEK.days[i];
    const contorno = atSchool(i) && d.items.find(it => it.slot === "contorno");
    const vegSide = !!contorno && contorno.group === "verdura";
    const vegLeft = vegSide && mark(d.date, "contorno") === "no";
    const potatoes = !!contorno && !vegSide;            // potatoes do not count as vegetables
    const noSchool = !atSchool(i);
    const veg = vegLeft || potatoes || noSchool ? 2 : 1;
    const done = state.dinners[d.date];
    const eaten = done === undefined ? pick : (done === "altro" ? null : done);
    if (eaten && eaten in home) home[eaten] += 1;
    home.verdura += veg; home.frutta += 1;
    if (noSchool) home.frutta += 1;   // lunch at home: one more fruit
    dinners.push({ pick, veg, vegLeft, potatoes, noSchool, missing, today, tomorrow, contorno, prev, done });
    prev = eaten;
  }
  return { dinners, home };
}

function weekendPlan() {
  const { home, dinners } = plan(4);
  const school = zero();
  for (let j = 0; j < 5; j++) add(school, schoolDay(j));
  const missing = {};
  for (const g in GROUPS) missing[g] = GROUPS[g].target - school[g] - home[g];
  const left = Object.assign({}, missing);
  const meals = [["Sabato", "pranzo"], ["Sabato", "cena"], ["Domenica", "pranzo"], ["Domenica", "cena"]];
  let prev = dinners[4].done === undefined ? dinners[4].pick : dinners[4].done;
  const used = {};
  const out = meals.map(([day, meal]) => {
    const pick = choose(left, new Set(prev ? [prev] : []));
    if (pick) left[pick] -= 1;
    prev = pick;
    const list = pick ? RECIPES.filter(r => r.group === pick) : [];
    const recipe = list.length ? list[(used[pick] = (used[pick] || 0) + 1) % list.length] : null;
    return { day, meal, pick, recipe };
  });
  return { missing, meals: out };
}

// ---------------------------------------------------------------- views
function renderHeader() {
  const p = state.profile;
  document.getElementById("header").innerHTML = p
    ? `<div><h1>Cena di casa</h1><p>${esc(p.name || "Il bambino")} · ${esc(INDEX.cicli[p.ciclo])} · Municipio ${esc(INDEX.municipi[p.mun])}</p></div>
       <button data-tab="impostazioni" aria-label="Impostazioni">⚙︎</button>`
    : `<div><h1>Cena di casa</h1><p>Il menù della mensa, la cena di casa</p></div>`;
}
function renderDays() {
  const el = document.getElementById("days");
  const show = state.profile && WEEK && ["oggi", "stasera"].includes(state.tab);
  el.hidden = !show;
  if (!show) return;
  const t = todayIso();
  el.innerHTML = WEEK.days.map((d, i) =>
    `<button class="${i === state.sel ? "on" : ""}${d.date === t ? " today" : ""}${d.items ? "" : " closed"}" data-day="${i}">${WEEKDAYS[parse(d.date).getDay()].slice(0, 3)}<b>${Number(d.date.slice(8))}</b></button>`).join("");
}
function renderNav() {
  const el = document.getElementById("nav");
  el.hidden = !state.profile;
  const tabs = [["oggi", "🍽️", "A scuola"], ["stasera", "🌙", "Stasera"], ["settimana", "📊", "Settimana"], ["weekend", "🧺", "Weekend"]];
  el.innerHTML = tabs.map(([k, ic, l]) =>
    `<button class="${state.tab === k ? "on" : ""}" data-tab="${k}"><span>${ic}</span>${l}</button>`).join("");
}

function viewWelcome() {
  const p = state.profile || { name: "", mun: 6, ciclo: 4 };
  const opts = (obj, sel, fmtL) => Object.entries(obj).map(([k, v]) => `<option value="${k}"${Number(k) === Number(sel) ? " selected" : ""}>${esc(fmtL(v))}</option>`).join("");
  return `<h2>${state.profile ? "Impostazioni" : "Benvenuti!"}</h2>
  ${state.profile ? "" : `<p class="hint">Ogni sera ti proponiamo cosa cucinare per completare quello che il bambino ha mangiato a scuola. Il menù arriva da solo dal sito del Comune di Roma.</p>`}
  <form class="card" id="profile">
    <label class="field" for="f-name">Nome del bambino (anche di fantasia)</label>
    <input id="f-name" name="name" maxlength="20" value="${esc(p.name)}" placeholder="Es. Lia">
    <label class="field" for="f-mun">Municipio della scuola</label>
    <select id="f-mun" name="mun">${opts(INDEX.municipi, p.mun, v => "Municipio " + v)}</select>
    <label class="field" for="f-ciclo">Tipo di scuola</label>
    <select id="f-ciclo" name="ciclo">${opts(INDEX.cicli, p.ciclo, v => v)}</select>
    <p class="hint" style="margin:8px 0 0">Il menù è lo stesso per tutte le scuole comunali del Municipio. Gli obiettivi della settimana sono quelli per 4–6 anni.</p>
    <button class="btn" type="submit">${state.profile ? "Salva" : "Cominciamo"}</button>
  </form>
  ${state.profile ? viewSettingsExtra() : `<p class="hint">Le spunte restano solo su questo telefono: nessun dato del bambino esce dall'app.</p>`}`;
}
function viewSettingsExtra() {
  const weeks = weeksAvailable(), cur = WEEK.start;
  const fetched = WEEK.days.find(d => d.fetched);
  return `<h3>Settimana</h3><div class="card">
    <select data-week>${(weeks.includes(cur) ? weeks : [cur, ...weeks]).map(w =>
      `<option value="${w}"${w === cur ? " selected" : ""}>${short(w)} – ${short(addDays(w, 4))}${w === mondayOf(todayIso()) ? " (questa)" : ""}</option>`).join("")}</select>
    <p class="hint" style="margin:6px 0 0">Per provare l'app su una settimana già passata. ${state.weekStart ? `<button class="link" data-week-today>Torna alla settimana di oggi</button>` : ""}</p></div>
  <h3>Menù</h3><div class="card" style="font-size:14px">Fonte: portale MESIS di Roma Capitale. ${fetched ? `Scaricato il ${short(fetched.fetched)}.` : ""}
    Mesi disponibili: ${Object.keys(INDEX.months).map(m => m.slice(5) + "/" + m.slice(0, 4)).join(", ")}.
    Il menù del mese nuovo si scarica da solo il 1° e il 25 di ogni mese.</div>
  <h3>Piatti non segnati</h3><div class="card" style="font-size:14px">Se non tocchi un piatto, come lo contiamo?
    <div class="switch"><button class="${state.unmarked === "ok" ? "on" : ""}" data-unmarked="ok">Mangiato tutto</button><button class="${state.unmarked === "no" ? "on" : ""}" data-unmarked="no">Non mangiato</button></div></div>
  <p style="text-align:center"><button class="link" data-reset>Cancella tutte le spunte</button></p>`;
}

function noMenuCard() {
  const weeks = weeksAvailable();
  const last = weeks[weeks.length - 1];
  return `<div class="info"><b>Il menù di questa settimana non c'è ancora.</b><br>
    Il Comune pubblica il menù del mese e l'app lo scarica da sola il 1° e il 25 di ogni mese.
    ${last ? `Intanto puoi provare l'app su una settimana già scaricata.<button class="btn ghost" data-week-set="${last}">Prova con la settimana ${short(last)} – ${short(addDays(last, 4))}</button>` : ""}</div>`;
}

function viewOggi() {
  if (!WEEK.days.some(d => d.items)) return noMenuCard();
  const d = WEEK.days[state.sel];
  let html = `<h2>A scuola, ${dayLabel(d.date)}</h2>`;
  if (!d.items) return html + `<div class="info">Nessun menù per questo giorno: festa o scuola chiusa. Stasera contiamo un pranzo a casa.</div>`;
  const absent = !!state.absent[d.date];
  html += `<div class="switch" style="margin:0 0 10px"><button class="${absent ? "" : "on"}" data-absent="0">A scuola</button><button class="${absent ? "on" : ""}" data-absent="1">Assente, a casa</button></div>`;
  if (absent) return html + `<div class="info">Oggi a scuola non conta niente: stasera la proposta tiene conto di un pranzo a casa.</div>`;
  html += `<p class="hint">Chiedi alla maestra e tocca un pallino: ✓ tutto · ½ metà · ✕ niente.</p>`;
  if (d.note) html += `<div class="info">${esc(d.note)}</div>`;
  for (const [title, slots] of [["Mattina", ["spuntino"]], ["Pranzo", ["primo", "secondo", "contorno", "frutta_dolce"]], ["Pomeriggio", ["merenda"]]]) {
    const items = d.items.filter(it => slots.includes(it.slot));
    if (!items.length) continue;
    html += `<h3>${title}</h3><div class="card">`;
    for (const it of items) {
      const m = mark(d.date, it.slot);
      const g = it.group ? (GROUPS[it.group] ? GROUPS[it.group].label : OTHER_LABEL[it.group] || it.group) : "gruppo sconosciuto";
      html += `<div class="row"><div class="dish">${esc(it.name)}<small>${SLOT_LABEL[it.slot]} · ${esc(g)}${it.guess ? " (stimato)" : ""}</small></div><div class="dots">` +
        [["ok", "✓", "tutto"], ["half", "½", "metà"], ["no", "✕", "niente"]].map(([k, s, a]) =>
          `<button class="dot ${k}${m === k ? " on" : ""}" aria-label="${a}" aria-pressed="${m === k}" data-slot="${it.slot}" data-v="${k}">${s}</button>`).join("") + `</div></div>`;
    }
    html += `</div>`;
  }
  const pane = d.items.find(it => it.slot === "pane");
  html += `<p class="hint">${pane ? esc(pane.name) + " a pranzo (non si segna). " : ""}Menù: ${esc(d.source)}.</p>`;
  return html + `<button class="btn" data-tab="stasera">Vedi la cena di stasera</button>`;
}

function dinnerWhy(x, i) {
  const { pick, missing, today, tomorrow, prev } = x;
  const words = arr => [...new Set(arr)].filter(g => g in ART).map(g => ART[g]).join(" e ") || "niente di questo";
  let why;
  if (pick) {
    why = `Questa settimana mancano ancora <strong>${fmt(missing[pick])} ${missing[pick] > 1 ? "porzioni" : "porzione"} di ${WORD[pick]}</strong>, contando anche i pranzi a scuola fino a venerdì. `;
    why += x.noSchool ? "Oggi niente pranzo a scuola" : `A pranzo oggi: ${words(today)}`;
    why += i < 4 ? (atSchool(i + 1) ? `; domani: ${words(tomorrow)}.` : "; domani niente scuola.") : "; domani è sabato.";
    if (prev && ART[prev]) why += ` Ieri sera: ${ART[prev]}.`;
  } else if (SECONDS.some(g => missing[g] > 0)) {
    why = "I secondi che mancano ci sono già a pranzo oggi o domani, o li avete mangiati ieri sera: stasera un piatto leggero con verdura, si recupera nei prossimi giorni.";
  } else {
    why = "I secondi della settimana sono già coperti: stasera basta un piatto leggero con verdura.";
  }
  if (x.vegLeft) why += ` A pranzo la verdura (${esc(x.contorno.name.toLowerCase())}) è rimasta nel piatto: stasera ne serve il doppio.`;
  if (x.potatoes) why += ` A pranzo il contorno era ${esc(x.contorno.name.toLowerCase())}: le patate non contano come verdura, quindi stasera verdura doppia.`;
  if (x.noSchool) why += " Senza il pranzo a scuola, oggi la verdura va doppia.";
  return why;
}

function viewStasera() {
  if (!WEEK.days.some(d => d.items)) return noMenuCard();
  const i = state.sel, d = WEEK.days[i];
  const x = plan(i).dinners[i];
  const plate = [];
  if (x.pick) plate.push(GROUPS[x.pick].label);
  plate.push(x.veg === 2 ? "Verdura (doppia)" : "Verdura", "Frutta", "Pane o cereali");
  const season = SEASON[Number(d.date.slice(5, 7))];
  let html = `<h2>Stasera, ${dayLabel(d.date)}</h2><div class="card">
    <div class="hint" style="margin:0">Per cena proponiamo</div><div class="big">${x.pick ? GROUPS[x.pick].label : "Cena leggera"}</div>
    <div class="plate">${plate.map(p => `<span class="chip">${p}</span>`).join("")}</div>
    <div class="why"><b>Perché</b>${dinnerWhy(x, i)}</div>
    <p class="hint" style="margin:8px 0 0">Verdura di stagione: ${season[0].join(", ")}.</p></div>`;
  if (x.pick) {
    html += `<h3>Idee per stasera</h3><div class="card">` + RECIPES.filter(r => r.group === x.pick).map(r =>
      `<button class="recipe-link" data-recipe="${r.id}">${esc(r.title)}<span>${r.minutes} min ›</span></button>`).join("") + `</div>`;
  }
  const opts = [...SECONDS.map(g => [g, GROUPS[g].label]), ["altro", "Altro"]];
  html += `<h3>Cosa avete mangiato a cena?</h3><div class="card" style="font-size:14px">
    Segnalo dopo cena: serve a fare bene i conti dei giorni dopo.
    <div class="choices">${opts.map(([k, l]) => `<button class="${x.done === k ? "on" : ""}" data-dinner="${k}">${l}</button>`).join("")}</div>
    <p class="hint" style="margin:8px 0 0">${x.done === undefined ? "Se non segni niente, contiamo la cena proposta." : "Tocca di nuovo per togliere il segno."}</p></div>`;
  html += `<div class="draft"><b>Bozza.</b> Regola semplificata, da validare con un dietista: si propone il secondo che manca di più nella settimana, saltando quelli del pranzo di oggi e di domani e quello della sera prima. Ricette di prova.</div>`;
  return html;
}

function viewSettimana() {
  if (!WEEK.days.some(d => d.items)) return noMenuCard();
  const t = todayIso();
  let upto = WEEK.days.reduce((a, d, i) => d.date <= t ? i : a, -1);
  if (state.weekStart) upto = state.sel;
  upto = Math.max(0, Math.min(4, upto));
  const { home } = plan(upto);
  const school = zero(), planned = zero();
  for (let j = 0; j < 5; j++) add(j <= upto ? school : planned, j <= upto ? schoolDay(j) : plannedDay(j));
  let html = `<h2>Settimana ${short(WEEK.start)} – ${short(addDays(WEEK.start, 4))}</h2>
    <p class="hint">Conti fino a ${dayLabel(WEEK.days[upto].date)}, cena compresa.</p>
    <div class="legend"><span><i style="background:var(--school)"></i>a scuola</span><span><i style="background:var(--home)"></i>a casa</span><span><i style="background:var(--ink);width:2px"></i>obiettivo</span></div><div class="card">`;
  for (const g in GROUPS) {
    const tgt = GROUPS[g].target, s = school[g], h = home[g], tot = s + h, scale = Math.max(tgt, tot);
    const rest = Math.max(0, tgt - tot - planned[g]);
    html += `<div class="bar-row"><div class="bar-head">${GROUPS[g].label}<span><b>${fmt(tot)}</b>/${tgt}</span></div>
      <div class="bar"><div class="s" style="width:${s / scale * 100}%"></div><div class="h" style="width:${h / scale * 100}%"></div>
      <div class="goal" style="left:calc(${tgt / scale * 100}% - 2px)"></div></div>
      <div class="bar-note">${planned[g] ? `A scuola nei prossimi giorni: ${fmt(planned[g])}. ` : ""}${rest ? `Restano ${fmt(rest)} per le altre cene e il weekend.` : "Coperto."}${GROUPS[g].note ? " Obiettivo " + GROUPS[g].note + "." : ""}</div></div>`;
  }
  html += `</div><div class="draft"><b>Bozza.</b> Obiettivi settimanali per 4–6 anni dal CREA, <i>Linee guida per una sana alimentazione</i> 2018, Tab. 9.2. Il conto (tutto = 1, metà = ½, niente = 0, un piatto conta solo per il suo gruppo principale, a ogni cena una verdura e una frutta) è una semplificazione da validare con un dietista.</div>`;
  return html;
}

function viewWeekend() {
  if (!WEEK.days.some(d => d.items)) return noMenuCard();
  const { missing, meals } = weekendPlan();
  const sat = addDays(WEEK.start, 5), month = Number(sat.slice(5, 7)), season = SEASON[month];
  let html = `<h2>Weekend ${short(sat)} – ${short(addDays(sat, 1))}</h2>`;
  const gaps = SECONDS.filter(g => missing[g] > 0);
  html += `<p class="hint">${gaps.length ? "Per chiudere la settimana mancano: " + gaps.map(g => `${fmt(missing[g])} ${WORD[g]}`).join(", ") + "." : "I secondi della settimana sono coperti: weekend libero, con verdura e frutta."}
    Il conto usa le spunte di scuola e le cene segnate; quelle future contano come proposte.</p><div class="card">`;
  for (const m of meals) {
    html += `<div class="meal"><div class="when">${m.day} ${m.meal}</div><div class="what">${m.pick ? GROUPS[m.pick].label : "Libero"}
      ${m.recipe ? `<small><button class="link" style="padding:0;text-align:left" data-recipe="${m.recipe.id}">${esc(m.recipe.title)}</button></small>` : `<small>pasta o pizza con verdura</small>`}</div></div>`;
  }
  html += `</div>`;
  const vegLeft = Math.max(4, missing.verdura), fruitLeft = Math.max(4, missing.frutta);
  const ingr = [];
  for (const m of meals) if (m.recipe) for (const x of m.recipe.ingredients) if (!ingr.includes(x)) ingr.push(x);
  html += `<h3>Lista della spesa</h3><div class="card"><ul class="list">${ingr.map(x => `<li>${esc(x)}</li>`).join("")}
    <li>Verdura di stagione per ${fmt(vegLeft)} porzioni: ${season[0].join(", ")}</li>
    <li>Frutta di stagione per ${fmt(fruitLeft)} porzioni: ${season[1].join(", ")}</li>
    <li>Latte e yogurt per le colazioni</li></ul></div>
    <div class="draft"><b>Bozza.</b> I pasti del weekend coprono prima i secondi che mancano di più, senza ripetere lo stesso due pasti di fila. Stagionalità indicativa per il Lazio.</div>`;
  return html;
}

function viewRecipe() {
  const r = RECIPES.find(x => x.id === state.recipe);
  if (!r) { state.recipe = null; return render(); }
  const d = WEEK.days[state.sel];
  return `<button class="back" data-close-recipe>‹ Indietro</button><h2>${esc(r.title)}</h2>
    <p class="hint">${GROUPS[r.group].label} · ${r.minutes} minuti · per 2 adulti e 1 bambino</p>
    <h3>Ingredienti</h3><div class="card"><ul class="list">${r.ingredients.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    <h3>Come si fa</h3><div class="card"><ol class="steps">${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
    <button class="btn" data-cook="${r.group}">Stasera cuciniamo questa (${dayLabel(d.date)})</button>
    <div class="draft"><b>Bozza.</b> Ricetta di prova, da rivedere con un dietista. Poco sale; per i bambini pesce senza spine e uova ben cotte.</div>`;
}

function render() {
  renderHeader(); renderNav(); renderDays();
  const main = document.getElementById("main");
  if (!state.profile) { main.innerHTML = viewWelcome(); return; }
  if (state.recipe) { main.innerHTML = viewRecipe(); document.getElementById("days").hidden = true; return; }
  main.innerHTML = ({ oggi: viewOggi, stasera: viewStasera, settimana: viewSettimana, weekend: viewWeekend,
    impostazioni: viewWelcome }[state.tab] || viewOggi)();
}

// ---------------------------------------------------------------- toast ("notifica di ricalcolo")
let toastTimer;
function toast(html) {
  const el = document.getElementById("toast");
  el.innerHTML = html; el.classList.remove("hide");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add("hide"), 6000);
}
const pickFor = i => { const x = plan(i).dinners[i]; return { pick: x.pick, veg: x.veg }; };

// ---------------------------------------------------------------- events
document.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b || (b.type === "submit" && b.form)) return;
  const ds = b.dataset;
  if (ds.day) state.sel = Number(ds.day);
  else if (ds.tab) { state.tab = ds.tab; state.recipe = null; scrollTo(0, 0); }
  else if (ds.slot) {
    const date = WEEK.days[state.sel].date, before = pickFor(state.sel);
    const c = state.checks[date] = state.checks[date] || {};
    if (c[ds.slot] === ds.v) delete c[ds.slot]; else c[ds.slot] = ds.v;
    const after = pickFor(state.sel);
    const name = g => g ? GROUPS[g].label.toLowerCase() : "una cena leggera";
    if (before.pick !== after.pick) toast(`Stasera cambia: ora proponiamo <b>${name(after.pick)}</b> (prima: ${name(before.pick)}).<button data-tab="stasera">Vedi</button>`);
    else if (before.veg !== after.veg) toast(after.veg === 2 ? `La verdura a pranzo è rimasta nel piatto: stasera <b>verdura doppia</b>.<button data-tab="stasera">Vedi</button>` : "Stasera basta una porzione di verdura.");
  }
  else if (ds.absent) { const date = WEEK.days[state.sel].date; if (ds.absent === "1") state.absent[date] = true; else delete state.absent[date]; }
  else if (ds.dinner) { const date = WEEK.days[state.sel].date; if (state.dinners[date] === ds.dinner) delete state.dinners[date]; else state.dinners[date] = ds.dinner; }
  else if (ds.recipe) { state.recipe = ds.recipe; scrollTo(0, 0); }
  else if ("closeRecipe" in ds) state.recipe = null;
  else if (ds.cook) { state.dinners[WEEK.days[state.sel].date] = ds.cook; state.recipe = null; state.tab = "stasera"; toast("Segnato: stasera " + GROUPS[ds.cook].label.toLowerCase() + "."); }
  else if (ds.unmarked) state.unmarked = ds.unmarked;
  else if (ds.weekSet) { state.weekStart = ds.weekSet; state.sel = 0; await loadWeek(); }
  else if ("weekToday" in ds) { state.weekStart = null; state.sel = null; await loadWeek(); }
  else if ("reset" in ds) { if (!confirm("Cancellare tutte le spunte e le cene segnate?")) return; state.checks = {}; state.absent = {}; state.dinners = {}; }
  else return;
  save(); render();
});
document.addEventListener("change", async e => {
  if (e.target.matches("[data-week]")) {
    const w = e.target.value;
    state.weekStart = w === mondayOf(todayIso()) ? null : w; state.sel = state.weekStart ? 0 : null;
    await loadWeek(); save(); render();
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "profile") return;
  e.preventDefault();
  const f = new FormData(e.target);
  const first = !state.profile;
  state.profile = { name: String(f.get("name") || "").trim(), mun: Number(f.get("mun")), ciclo: Number(f.get("ciclo")) };
  state.tab = "oggi"; state.sel = null;
  await loadWeek(); save(); render();
  if (!first) toast("Impostazioni salvate.");
});

// ---------------------------------------------------------------- start
(async function start() {
  try {
    INDEX = await getJson("data/index.json");
    if (state.profile) await loadWeek();
    render();
  } catch (err) {
    document.getElementById("main").innerHTML = `<div class="info">Non riesco a caricare il menù. Controlla la connessione e riprova.<br><small>${esc(err.message)}</small></div>`;
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
